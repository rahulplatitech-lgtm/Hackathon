services:
  - type: web
    name: crisis-sync-api
    env: python
    rootDir: Deployment-ready-code/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
